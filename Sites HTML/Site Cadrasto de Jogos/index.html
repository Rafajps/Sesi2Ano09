<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="stylesheet" href="css.css">
    <title>Cadrasto de Jogos</title>
</head>

<body>
    <header>
        <h1>Cadrastar Jogos!</h1>
    </header>
    <div class="cad">
        <label for="">Nome</label>
        <input id="nome" type="text" placeholder="Digite o nome do jogo">
        <label for="ano">Ano</label>
        <input id="ano" type="number" placeholder="Digite o ano do jogo">
        <label for="plataforma">Plataforma</label>
        <select name="plataforma">
            <option value="sel">Selecione Uma Opção</option>
            <option value="cel">Celular</option>
            <option value="pc">Computador</option>
            <option value="con">Console</option>
        </select>
        <label for="genero">Gênero</label>
        <select name="genero">
            <option value="sel">Selecione Uma Opção</option>
            <option value="acao">Ação</option>
            <option value="aven">Aventura</option>
            <option value="rpg">RPG</option>
        </select>
        <button class="botao" onclick="botao()">Cadrastar</button>
    </div>
    <div class="tab">
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Ano</th>
                    <th>Plataforma</th>
                    <th>Gênero</th>
                </tr>
            </thead>

            <tbody id="tabelaJogos">
                <!-- Isso pra ficar com a linha horizontal o js cria o formato da tabela-->
            </tbody>
        </table>

    </div>
    <script src="js.js"></script>
</body>

</html>
